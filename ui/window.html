<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebDAV</title>
    <link rel="stylesheet" href="window.css" />
  </head>
  <body>
    <div class="progress" id="progress" hidden></div>

    <header class="toolbar">
      <form id="connect-form" autocomplete="off">
        <div class="row">
          <label class="field scheme">
            <span>Scheme</span>
            <select id="scheme" name="scheme">
              <option value="https">https</option>
              <option value="http">http</option>
            </select>
          </label>
          <label class="field host">
            <span>Host</span>
            <input id="host" name="host" type="text" placeholder="nas.local or full URL" spellcheck="false" />
          </label>
          <label class="field port">
            <span>Port</span>
            <input id="port" name="port" type="text" inputmode="numeric" placeholder="443" spellcheck="false" />
          </label>
          <label class="field path">
            <span>Path</span>
            <input id="path" name="path" type="text" placeholder="/webdav" spellcheck="false" />
          </label>
          <button type="submit" class="btn primary" id="connect-btn">Connect</button>
        </div>
        <div class="row">
          <label class="field user">
            <span>User</span>
            <input id="username" name="username" type="text" placeholder="optional" spellcheck="false" />
          </label>
          <label class="field password">
            <span>Password</span>
            <input id="password" name="password" type="password" placeholder="optional" />
          </label>
          <label class="check">
            <input id="insecure" name="insecure" type="checkbox" />
            Allow self-signed certificates
          </label>
        </div>
      </form>
    </header>

    <nav class="crumbs" id="crumbs" aria-label="Current location">
      <div class="crumbs-path" id="crumbs-path"></div>
      <button type="button" class="btn ghost" id="refresh-btn" disabled>Refresh</button>
    </nav>

    <section class="table" aria-label="Directory contents">
      <div class="thead">
        <div class="col name">Name</div>
        <div class="col size">Size</div>
        <div class="col modified">Modified</div>
      </div>
      <div class="tbody" id="list" role="listbox" aria-multiselectable="true" tabindex="0">
        <div class="empty" id="empty">
          Enter a host, port, and path, then connect.<br />
          You can also paste a full WebDAV URL into the host field.
        </div>
      </div>
    </section>

    <footer class="footer">
      <label class="check">
        <input id="recursive" type="checkbox" checked />
        Include subfolders
      </label>
      <div class="spacer"></div>
      <button type="button" class="btn" id="add-selected-btn" disabled>Add selected</button>
      <button type="button" class="btn" id="add-folder-btn" disabled>Add this folder to playlist</button>
    </footer>

    <div class="status" id="status" role="status">Not connected</div>

    <script src="window.js"></script>
  </body>
</html>
